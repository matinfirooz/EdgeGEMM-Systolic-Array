<text id="t44" x="44" y="903" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#61717d" text-anchor="start">The final clamp alone reduces precision to OUT_W. ReLU clamps at output zero_point; input zero-point subtraction is outside this datapath.</text>
